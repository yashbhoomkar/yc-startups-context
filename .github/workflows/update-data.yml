name: Update YC dataset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/build_dataset.py"
      - "scripts/enrich_dataset.py"
      - "data/verified_enrichment.csv"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-yc-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Enrich dataset
        run: python scripts/enrich_dataset.py
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Dataset is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh YC startup dataset"
          git push
